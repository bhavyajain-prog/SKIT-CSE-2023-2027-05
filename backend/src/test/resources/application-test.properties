# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/backend_test
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
# Same as production: Flyway owns the schema and Hibernate only validates it,
# so a migration that drifts from the entities fails the test run.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The test database is disposable: TestFlywayConfig cleans it before migrating.
spring.flyway.clean-disabled=false

# Server
server.port=8080
