# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/backend_test
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Flyway (disabled for tests; Hibernate manages the test schema directly)
spring.flyway.enabled=false

# Server
server.port=8080
# JWT (test-only secret)
app.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=
app.jwt.access-expiry-ms=900000
app.jwt.refresh-expiry-ms=604800000
