 # PostgreSQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
# Logging
logging.level.root=INFO
logging.level.com.kronostt=INFO
# JWT (real secret comes from the JWT_SECRET env var / .env, never commit it)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiry-ms=900000
app.jwt.refresh-expiry-ms=604800000

# First SUPER_ADMIN, created at startup only if no user has this email yet.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_NAME:Administrator}
