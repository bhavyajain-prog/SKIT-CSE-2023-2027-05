name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST = 18:29 UTC
    - cron: "29 18 * * 4"

  # Allows manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PDF & Graph Dependencies
        run: pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        run: python generate_report.py weekly

      - name: Move PDF to Weekly Reports Directory
        run: |
          mkdir -p weekly_reports
          mv *_Weekly_Progress_Report_Form-3_*.pdf weekly_reports/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/weekly-progress-report
          base: main
          delete-branch: true
          title: "docs: archive Form-3 weekly progress report"
          commit-message: "docs: archive Form-3 weekly progress report"
          body: |
            This PR contains the automatically generated
            Form-3 weekly progress report.

            Generated by the Weekly Progress Report workflow.
          add-paths: |
            weekly_reports/
